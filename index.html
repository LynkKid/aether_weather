<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether Weather - Modern Meteorological Forecasting & Severe Alerts</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .app-badge {
            display: inline-block;
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            background: linear-gradient(135deg, #ffffff 40%, #bae6fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin: 0 0 36px 0;
        }
        .nav-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        footer {
            border-top: 1px solid var(--border);
            padding-top: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        footer a {
            color: #38bdf8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="app-badge">Weather &bull; Radar &bull; Alerts</div>
        <h1>Aether Weather</h1>
        <p class="subtitle">
            A modern, hyper-accurate weather companion combining precision meteorological forecasting, live radar maps, and severe atmospheric alerts.
        </p>

        <div class="nav-links">
            <a href="privacy-policy.html" class="btn btn-primary">Privacy Policy</a>
            <a href="terms-of-service.html" class="btn btn-outline">Terms of Service</a>
        </div>

        <footer>
            &copy; 2026 Aether Weather. Developed by LynkKid.
        </footer>
    </div>
</body>
</html>
